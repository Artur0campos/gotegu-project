<form [formGroup]="formGroup" id="card">
    <div id="title">
        <h2>{{ text_title }}</h2>
    </div>
    <div id="content">
        <ng-content></ng-content>
    </div>
    <div class="btn-div">
        <app-primary-btn (btnClick)="onClick()" text={{text_btn}} icon={{icon}}></app-primary-btn>
        <app-primary-btn text="deletar" variant="secondary" *ngIf="showDeleteButton"
            icon="ph ph-download-simple"></app-primary-btn>
    </div>

</form>
