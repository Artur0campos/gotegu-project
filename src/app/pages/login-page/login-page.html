<div id="main-page">

    <div id="overlay"></div>

    <div id="content">

        <div id="main-left">
            <img src="/login/Gemini_Generated_Image_f2duyuf2duyuf2du (1) 1.png" alt="Logo Gotegu">

            <h1>GOTEGU</h1>
            <h2>Se inspire & transforme</h2>
        </div>

        <div id="main-right">

            <form [formGroup]="userForm" (ngSubmit)="cadastro_user()" id="card-inscricao">

                <div id="top-card">
                    <h3>Login de Usuário</h3>
                </div>

                <div class="inputs-container">

                    <app-input-component text="CPF" placeholder="000.000.000-00" formControlName="cpf">
                    </app-input-component>


                    <app-input-component text="Senha" placeholder="••••••••" formControlName="senha">
                    </app-input-component>

                </div>

                <div class="btn-container">
                    <app-primary-btn type="submit" icon="ph ph-arrow-circle-up" text="Login"></app-primary-btn>
                </div>
                <a href="/registerUser">crie sua conta</a>
                <p [class]="msgClass">
                    {{ msg }}
                </p>



            </form>

        </div>

    </div>

</div>
