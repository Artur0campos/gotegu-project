<app-header></app-header>
<div class="container-main">
    <h3 id="titulo">Lista de usuários</h3>
    <div class="add-user-container">
        <h4>Adicionar usuário</h4>
        <app-add-button (addClick)="nav()"></app-add-button>
    </div>
    @for (user_ of lista_users; track user_.cpf) {
    <app-list-item [idUser]="user_.id" [cpfUser]="user_.cpf" [emailUser]="user_.email" [nomeUser]="user_.nome"
        [isadmin]="user_.administrador" (sAction)="delete_user(user_.id)" (pAction)="promo(user_.id)"></app-list-item>
    }
</div>
