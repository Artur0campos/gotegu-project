<app-header></app-header>
<app-card-promo></app-card-promo>
<app-container-main>
    @if ( eventos_disponiveis.length == 0 ) {
    <h3>Nenhum evento disponível</h3>
    }@else {
    @for (evento of eventos_disponiveis; track evento.id) {
    <app-card-evento [nome]="evento.nome" [descricao]="evento.descricao" [dt_inicio]="evento.dt_inicio"
        [evento]="evento"></app-card-evento>
    }

    }
</app-container-main>
